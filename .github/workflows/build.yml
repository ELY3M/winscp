name: Build WinSCP

on:
  push:
  pull_request:
  workflow_call: 
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build platform'
        required: false
        default: 'Win64'
        type: choice
        options:
          - Win32
          - Win64

jobs:
  build:
    name: Build (${{ github.event.inputs.platform || 'Win64' }})
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set platform
        id: platform
        shell: cmd
        run: |
          if "${{ github.event.inputs.platform }}"=="" (
            echo PLATFORM=Win64>> %GITHUB_ENV%
          ) else (
            echo PLATFORM=${{ github.event.inputs.platform }}>> %GITHUB_ENV%
          )

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore .NET dependencies
        shell: cmd
        working-directory: dotnet
        run: dotnet restore WinSCPnet.csproj

      - name: Build WinSCPnet (.NET wrapper)
        shell: cmd
        working-directory: dotnet
        run: dotnet build WinSCPnet.csproj -c Release --no-restore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WinSCP-${{ env.PLATFORM }}-${{ github.sha }}
          path: |
            dotnet/bin/Release/net40/WinSCPnet.dll
            dotnet/bin/Release/netstandard2.0/WinSCPnet.dll
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: [self-hosted, windows]
    ##if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: WinSCP-*-${{ github.sha }}
          merge-multiple: true
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: WinSCP ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/WinSCP.exe
            artifacts/WinSCP.com
            artifacts/WinSCPnet.dll
            artifacts/DragExt64.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
